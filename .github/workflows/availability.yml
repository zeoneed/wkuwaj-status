name: Dostępność Wkuwaj.pl
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Rodzaj kontroli
        type: choice
        options:
          - production
          - test-failure
          - test-recovery
        default: production
permissions:
  contents: write
  issues: write
concurrency:
  group: availability-monitor
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Kontrola stanu i alarm przy zmianie
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_MODE: ${{ inputs.mode || 'production' }}
        run: python3 monitor.py
